name: deploy-pages

on:
  push:
    branches: [main]
    paths: ["web/**", "graph/**", "samples/**"]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site (web + real samples + graph manifests)
        run: |
          mkdir -p _site
          cp -r web/. _site/
          cp -r samples _site/samples
          cp -r graph _site/graph
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
